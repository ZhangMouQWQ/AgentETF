name: API 数据源诊断

on:
  workflow_dispatch:
    inputs:
      quick:
        description: '快速模式 (仅5只ETF)'
        required: false
        default: false
        type: boolean

concurrency:
  group: api-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 API 诊断
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            python _api_diagnose.py --quick
          else
            python _api_diagnose.py
          fi

      - name: 上传诊断产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-diagnose-${{ github.run_id }}
          path: data/api_diagnose.json
          retention-days: 30
