name: 数据抓取

on:
  workflow_dispatch:

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取数据 (强制刷新, 验证完整性)
        run: python fetch_data.py

      - name: 生成持仓信号
        if: success()
        run: python main.py --signal

      - name: 提交数据
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ logs/
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "data: 手动更新 [$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')]"
            git push
          fi
