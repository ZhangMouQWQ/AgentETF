name: 更新ETF动量轮动信号

on:
  schedule:
    # UTC 3:45 = 北京时间 11:45（上午休市后，数据已稳定）
    - cron: '45 3 * * 1-5'
    # UTC 7:15 = 北京时间 15:15（下午收盘后，数据已稳定）
    - cron: '15 7 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover tests
      - name: Execute strategy and generate output
        id: strategy
        run: python strategy.py
        # 策略失败不阻断，但标记状态供后续步骤判断
        continue-on-error: true

      - name: Collect API diagnostics (fixtures for local analysis)
        run: python data_collector.py
        continue-on-error: true

      - name: Verify output files exist
        run: |
          for f in index.html data.json; do
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then
              echo "ERROR: $f missing or empty — strategy may have failed"
              exit 1
            fi
          done
          echo "All output files generated successfully"

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html data.json diagnostic.json _fixtures/collector_output.json
          git diff --staged --quiet || (git commit -m "📊 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') 自动更新" && git push)
